
name: CI Pipeline
# testing dependency cache reuse

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}-v1
          restore-keys: |
            ${{ runner.os }}-node-
            

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: echo "Application build successful"

      - name: Test
        run: npm test

      - name: Deploy
        run: echo "Application deployment successful"
